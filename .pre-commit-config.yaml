repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # reports/recovered_canon/ace_review__ holds evidence archives whose files
      # are hash-pinned by their own promotion_review.json manifest. Whitespace
      # normalisation breaks that chain, so these two hooks must not touch them.
      - id: trailing-whitespace
        exclude: ^(archives/|GUMAS_SIM_2.5/|reports/recovered_canon/ace_review__)
      - id: end-of-file-fixer
        exclude: ^(archives/|GUMAS_SIM_2.5/|reports/recovered_canon/ace_review__)
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]

  - repo: local
    hooks:
      - id: workspace-verify
        name: workspace-verify (self-healing for regenerable surfaces)
        entry: python3 tools/workspace_verify_precommit.py
        language: system
        pass_filenames: false
        always_run: true
