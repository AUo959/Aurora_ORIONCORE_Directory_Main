# Paths where an execution-context reference is deliberate, not a provenance defect.
#
# The execution_context_paths check keeps a sandbox's view of itself out of
# tracked generated artifacts. Documents that *describe* such a contamination
# have to quote the offending path as evidence, which trips the same check.
# Those go here, one entry per path, each with a reason.
#
# This file exempts documentation only. Do not add a generated artifact
# (a run_meta.json, a scan output) here to silence a real finding — regenerate
# it from the canonical workspace instead.

