name: ACE v0.3 Session Closeout

on:
  push:
    branches:
      - agent/ace-v0-3-session-closeout

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: agent/ace-v0-3-session-closeout

      - name: Refresh ACE handoff state
        env:
          BASE_MAIN_SHA: 24ce40f63fa06758728fe246c447d1110709a69e
          WORKFLOW_PATH: .github/workflows/ace-v0-3-session-closeout.yml
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('catalog/session_state.json')
          state = json.loads(path.read_text(encoding='utf-8'))
          now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          base_sha = os.environ['BASE_MAIN_SHA']

          for item in state.get('pending_for_next_session', []):
              if item.get('id') == 'ace-v0-2-scope':
                  item['id'] = 'ace-next-scope'
                  item['description'] = (
                      'ACE now has executable RETRIEVED_CANON, DERIVED_CANON, GENERATED_CANON, '
                      'CANON_REVISION, TRUE_CONFLICT, and EXECUTION_BLOCKED semantics; shared '
                      'interactive/embedded/autonomic invocation; facility/topology completion; '
                      'authority-gated facility materialization; and an append-only determination '
                      'ledger. Remaining major scope is existing-character retrieval, relation-evidence '
                      'enrichment and repository-wide evidence discovery, capability-manifest discovery, '
                      'MCP exposure, native multi-artifact character materialization, and non-character '
                      'entity classes beyond the facility/canon-fact slices.'
                  )

          completed = state.setdefault('completed_tasks', [])
          completed[:] = [item for item in completed if item.get('id') != 'ace-v0-3-canon-determination']
          completed.append({
              'id': 'ace-v0-3-canon-determination',
              'status': 'completed',
              'completed_at': now,
              'platform': 'chatgpt-github',
              'detail': (
                  'Completed via OrionCore PR #66, squash merge '
                  '24ce40f63fa06758728fe246c447d1110709a69e. ACE now executes all six '
                  'determination states. v0.3 adds read-only bounded CanonRec evidence retrieval, '
                  'allowlisted deterministic derivation, and fail-closed TRUE_CONFLICT with complete '
                  'claim/source provenance. Final PR and post-merge mainline gates passed Python 3.9, '
                  'full provisioned Python 3.12, workspace verification, lint/schema, repo sync, and '
                  'gitleaks. No Orion L1 runtime/provider state was activated and the paused experiment '
                  'was not started, resumed, or advanced.'
              ),
          })

          state['last_updated'] = now
          state['last_platform'] = 'chatgpt-github'
          state['last_session_summary'] = (
              'ACE v0.3 canon retrieval, deterministic derivation, and true-conflict semantics merged; '
              'all six ACE determination states are now executable.'
          )
          state.setdefault('known_state', {})['main_sha'] = base_sha

          recent = state.setdefault('recent_commits', [])
          recent = [item for item in recent if item.get('sha') != base_sha[:7]]
          recent.insert(0, {
              'sha': base_sha[:7],
              'date': '2026-08-11',
              'platform': 'chatgpt-github',
              'summary': 'feat(ace): executable canon retrieval, derivation, and true conflict v0.3',
          })
          state['recent_commits'] = recent[:10]

          path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')
          Path(os.environ['WORKFLOW_PATH']).unlink()
          PY
          python tools/session_state_check.py --path catalog/session_state.json
          git diff --check

      - name: Commit coordination-only closeout
        run: |
          git config user.name "Aurora Coordination Bot"
          git config user.email "coordination@aurora.local"
          git add catalog/session_state.json .github/workflows/ace-v0-3-session-closeout.yml
          git commit -m "chore(session): close ACE v0.3 determination cycle"
          git push origin HEAD:agent/ace-v0-3-session-closeout
