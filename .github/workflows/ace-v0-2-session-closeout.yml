name: ACE v0.2 Session Closeout

on:
  push:
    branches:
      - agent/ace-v0-2-session-closeout

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: agent/ace-v0-2-session-closeout

      - name: Refresh canonical handoff state and remove one-shot workflow
        env:
          BASE_MAIN_SHA: 47dcecf76b2299c8b6db76cdc878c446d8da6e1f
          WORKFLOW_PATH: .github/workflows/ace-v0-2-session-closeout.yml
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("catalog/session_state.json")
          state = json.loads(path.read_text(encoding="utf-8"))
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          base_sha = os.environ["BASE_MAIN_SHA"]

          pending = state.get("pending_for_next_session", [])
          state["pending_for_next_session"] = [
              item for item in pending if item.get("id") != "ace-v0-2-materialization"
          ]

          for item in state["pending_for_next_session"]:
              if item.get("id") == "ace-v0-2-scope":
                  item["description"] = (
                      "ACE v0.2 now includes facility/topology completion, shared interactive/embedded/autonomic "
                      "invocation, an authority-gated CanonRec facility materializer, and an append-only determination "
                      "ledger with executable EXECUTION_BLOCKED / GENERATED_CANON / CANON_REVISION states. Remaining "
                      "scope is existing-character retrieval, relation-evidence enrichment, MCP exposure, native "
                      "multi-artifact character materialization, non-character classes beyond the facility slice, and "
                      "executable RETRIEVED_CANON / DERIVED_CANON / TRUE_CONFLICT paths."
                  )

          completed = state.setdefault("completed_tasks", [])
          completed[:] = [
              item for item in completed if item.get("id") != "ace-v0-2-materialization"
          ]
          completed.append(
              {
                  "id": "ace-v0-2-materialization",
                  "status": "completed",
                  "completed_at": now,
                  "platform": "codex",
                  "detail": (
                      "Completed via OrionCore PR #64, merge 47dcecf76b2299c8b6db76cdc878c446d8da6e1f. "
                      "ACE now has an explicit-authority, feature-branch-only CanonRec facility materializer with "
                      "baseline compare-and-swap, declared-target writes, post-commit rollback/sidecar cleanup, and "
                      "append-only determination lineage/querying. GENERATED_CANON and CANON_REVISION are executable "
                      "only after a real Git commit; the prior EXECUTION_BLOCKED receipt remains immutable. Mainline "
                      "Python 3.12 tests passed 539/539 executed tests (36 skipped); the only post-merge red was the "
                      "expected stale session_state freshness gate, repaired by this closeout. No Orion L1 runtime or "
                      "experiment state was started, resumed, or advanced."
                  ),
              }
          )

          state["last_updated"] = now
          state["last_platform"] = "codex"
          state["last_session_summary"] = (
              "ACE v0.2 materialization + determination ledger merged via root PR #64; "
              "cross-platform handoff refreshed after the post-merge freshness gate."
          )
          state.setdefault("known_state", {})["main_sha"] = base_sha

          recent = state.setdefault("recent_commits", [])
          recent = [item for item in recent if item.get("sha") != base_sha[:7]]
          recent.insert(
              0,
              {
                  "sha": base_sha[:7],
                  "date": "2026-08-11",
                  "platform": "codex",
                  "summary": "feat(ace): merge materialization + determination ledger v0.2",
              },
          )
          state["recent_commits"] = recent[:10]

          path.write_text(json.dumps(state, indent=2) + "\n", encoding="utf-8")
          Path(os.environ["WORKFLOW_PATH"]).unlink()
          PY

          python tools/session_state_check.py --path catalog/session_state.json
          git diff --check
          git diff -- catalog/session_state.json

      - name: Commit coordination-only closeout
        run: |
          git config user.name "Aurora Coordination Bot"
          git config user.email "coordination@aurora.local"
          git add catalog/session_state.json .github/workflows/ace-v0-2-session-closeout.yml
          git commit -m "chore(session): close ACE v0.2 materialization cycle"
          git push origin HEAD:agent/ace-v0-2-session-closeout
