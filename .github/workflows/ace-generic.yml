name: ACE Generic Entity Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/ace/generic_entity*.py"
      - "tools/aurora_ace_entity.py"
      - "tests/test_aurora_ace_generic_entity.py"
      - "catalog/ace/capability_manifests/generic_entities.jsonl"
      - "catalog/ace/runtime_bindings.json"
      - "catalog/contracts/aurora_ace_generic_native_entity_v0_11.json"
      - "docs/AURORA_ACE__ADDENDUM__GENERIC_NATIVE_ENTITIES__v0.11__2026-08-13.md"
      - ".github/workflows/ace-generic.yml"
  push:
    branches: [main]
    paths:
      - "tools/ace/generic_entity*.py"
      - "tools/aurora_ace_entity.py"
      - "tests/test_aurora_ace_generic_entity.py"
      - "catalog/ace/capability_manifests/generic_entities.jsonl"
      - "catalog/ace/runtime_bindings.json"
      - "catalog/contracts/aurora_ace_generic_native_entity_v0_11.json"
      - "docs/AURORA_ACE__ADDENDUM__GENERIC_NATIVE_ENTITIES__v0.11__2026-08-13.md"
      - ".github/workflows/ace-generic.yml"

permissions:
  contents: read

jobs:
  unit:
    name: Generic entity routing + native validation (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --only-binary=:all: \
            pytest==8.4.2 pyyaml==6.0.3 jsonschema==4.25.1
      - env:
          PYTHONPATH: tools
        run: pytest tests/test_aurora_ace_generic_entity.py -v --tb=short

  e2e:
    name: Generic entity CanonRec E2E (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --only-binary=:all: \
            pytest==8.4.2 pyyaml==6.0.3 jsonschema==4.25.1
      - name: Read registered nested repository pins
        id: pins
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          rows = {r["name"]: r for r in yaml.safe_load(open("catalog/repo_registry.yaml"))["repos"]}
          for key, name in (("cloudbank", "aurora-cloudbank-symbolic-main"), ("canonrec", "CanonRec")):
              print(f"{key}_sha={rows[name]['head_sha']}")
              print(f"{key}_branch={rows[name]['branch']}")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AUo959/aurora-cloudbank-symbolic
          ref: ${{ steps.pins.outputs.cloudbank_sha }}
          path: GUMAS_SIM_2.5/Aurora_Sim_Architecture/aurora-cloudbank-symbolic-main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AUo959/CanonRec
          ref: ${{ steps.pins.outputs.canonrec_sha }}
          path: GUMAS_SIM_2.5/CanonRec
          # Required so ACE refresh_on_paths staleness can be evaluated; see ci.yml.
          fetch-depth: 0
      - name: Place provisioned repositories on registered branches
        run: |
          git -C GUMAS_SIM_2.5/Aurora_Sim_Architecture/aurora-cloudbank-symbolic-main checkout -B "${{ steps.pins.outputs.cloudbank_branch }}"
          git -C GUMAS_SIM_2.5/CanonRec checkout -B "${{ steps.pins.outputs.canonrec_branch }}"
      - env:
          PYTHONPATH: tools
          ACE_GENERIC_E2E: "1"
        run: pytest tests/test_aurora_ace_generic_entity.py -k end_to_end_commit_and_replay_refusal -v --tb=short
