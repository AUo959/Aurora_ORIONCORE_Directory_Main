name: Refresh Branch Session State

on:
  push:
    branches:
      - governance/l1-institutional-assurance-classification
    paths:
      - .github/workflows/agent-refresh-session-state.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: governance/l1-institutional-assurance-classification
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh mechanical session state
        run: python3 tools/session_stop_hook.py

      - name: Commit session state and remove temporary workflow
        run: |
          rm -f catalog/session_claims/.orphan_*.json
          git restore --worktree --staged \
            reports/automation/skill_sync_latest.json \
            reports/analysis/workspace_verify_latest.json \
            reports/analysis/workspace_scan_summary.json \
            2>/dev/null || true
          git rm .github/workflows/agent-refresh-session-state.yml
          git add catalog/session_state.json
          git config user.name "aurora-githubops"
          git config user.email "aurora-githubops@users.noreply.github.com"
          git commit -m "chore: refresh session handoff state"
          git push origin HEAD:governance/l1-institutional-assurance-classification
