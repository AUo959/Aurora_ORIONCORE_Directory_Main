name: ACE v1 Composition Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/ace/**"
      - "tools/aurora_ace*.py"
      - "tests/test_aurora_ace*.py"
      - "catalog/ace/**"
      - "catalog/contracts/aurora_ace*.json"
      - "catalog/schemas/aurora_ace*.json"
      - "docs/AURORA_ACE*.md"
      - "requirements-ace-mcp.txt"
      - ".github/workflows/ace-v1-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "tools/ace/**"
      - "tools/aurora_ace*.py"
      - "tests/test_aurora_ace*.py"
      - "catalog/ace/**"
      - "catalog/contracts/aurora_ace*.json"
      - "catalog/schemas/aurora_ace*.json"
      - "docs/AURORA_ACE*.md"
      - "requirements-ace-mcp.txt"
      - ".github/workflows/ace-v1-acceptance.yml"

permissions:
  contents: read

jobs:
  composition:
    name: Repository-grounded matrix + isolated transactions (py3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OrionCore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ACE acceptance dependencies
        run: |
          python -m pip install --only-binary=:all: \
            pytest==8.4.2 \
            jsonschema==4.25.1 \
            -r requirements-ace-mcp.txt

      - name: Read registered nested repository pins
        id: pins
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml

          rows = {
              row["name"]: row
              for row in yaml.safe_load(open("catalog/repo_registry.yaml"))["repos"]
          }
          for key, name in (
              ("cloudbank", "aurora-cloudbank-symbolic-main"),
              ("canonrec", "CanonRec"),
          ):
              print(f"{key}_sha={rows[name]['head_sha']}")
              print(f"{key}_branch={rows[name]['branch']}")
          PY

      - name: Provision registered CloudBank owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: AUo959/aurora-cloudbank-symbolic
          ref: ${{ steps.pins.outputs.cloudbank_sha }}
          path: GUMAS_SIM_2.5/Aurora_Sim_Architecture/aurora-cloudbank-symbolic-main

      - name: Provision registered CanonRec authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: AUo959/CanonRec
          ref: ${{ steps.pins.outputs.canonrec_sha }}
          path: GUMAS_SIM_2.5/CanonRec
          # Required so ACE refresh_on_paths staleness can be evaluated; see ci.yml.
          fetch-depth: 0

      - name: Place nested repositories on registered branches
        run: |
          git -C GUMAS_SIM_2.5/Aurora_Sim_Architecture/aurora-cloudbank-symbolic-main \
            checkout -B "${{ steps.pins.outputs.cloudbank_branch }}" \
            "${{ steps.pins.outputs.cloudbank_sha }}"
          git -C GUMAS_SIM_2.5/CanonRec \
            checkout -B "${{ steps.pins.outputs.canonrec_branch }}" \
            "${{ steps.pins.outputs.canonrec_sha }}"

      - name: Produce the ACE v1 acceptance candidate receipt
        run: |
          python tools/aurora_ace_acceptance.py \
            --run-practical \
            --include-isolated \
            --report-out reports/ci/aurora-ace-v1-acceptance.json \
            --summary

      - name: Upload ACE v1 acceptance receipt
        if: always() && hashFiles('reports/ci/aurora-ace-v1-acceptance.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: aurora-ace-v1-acceptance
          path: reports/ci/aurora-ace-v1-acceptance.json
