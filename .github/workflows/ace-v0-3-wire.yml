          replace(
              "tools/aurora_ace.py",
              '''    elif entity_type == "facility":
        required.add("ace.capability.canonrec.materialize.entity")
''',
              '''    elif entity_type == "facility":
        required.add("ace.capability.canonrec.materialize.entity")
    elif entity_type == "canon_fact":
        required.add("ace.capability.canonrec.retrieve.claims")
        if query.get("query_kind") == "derive":
            required.add("ace.capability.canonrec.derive.claims")
''',
          )

          # Deliberately mark all six determination states executable.
          replace(
              "tests/test_aurora_ace_invariants.py",
              '''    The v0.2 materialization slice makes GENERATED_CANON and CANON_REVISION
    reachable while preserving EXECUTION_BLOCKED for complete packets lacking
    persistence authority. RETRIEVED_CANON, DERIVED_CANON, and TRUE_CONFLICT are
    still not executable end states in this implementation and remain explicit
    future slices rather than implied capabilities.
''',
              '''    The v0.3 canon-determination slice adds read-only RETRIEVED_CANON,
    DERIVED_CANON, and TRUE_CONFLICT paths. Together with v0.2 materialization,
    every determination state in the ACE contract is now executable and must
    remain deliberate rather than vocabulary-only.
''',
          )
          replace(
              "tests/test_aurora_ace_invariants.py",
              '''    assert emitted == {"EXECUTION_BLOCKED", "GENERATED_CANON", "CANON_REVISION"}, (
''',
              '''    assert emitted == {
        "RETRIEVED_CANON",
        "DERIVED_CANON",
        "GENERATED_CANON",
        "CANON_REVISION",
        "TRUE_CONFLICT",
        "EXECUTION_BLOCKED",
    }, (
''',
          )

          Path(".github/workflows/ace-v0-3-wire.yml").unlink()
          PY

          python -m pytest -q \
            tests/test_aurora_ace_canon_resolution.py \
            tests/test_aurora_ace_invocation.py \
            tests/test_aurora_ace_invariants.py
          git diff --check

      - name: Commit wired v0.3 slice
        run: |
          git config user.name "Aurora ACE Integration"
          git config user.email "ace-integration@aurora.local"
          git add tools/ace/core.py tools/ace/invocation.py tools/ace/__init__.py tools/aurora_ace.py tests/test_aurora_ace_invariants.py .github/workflows/ace-v0-3-wire.yml
          git commit -m "feat(ace): wire canon determination into shared engine"
          git push origin HEAD:agent/ace-v0-3-canon-determination
