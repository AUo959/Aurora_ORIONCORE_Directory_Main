name: ACE v0.3 Canon Determination Wiring

on:
  push:
    branches:
      - agent/ace-v0-3-canon-determination

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: agent/ace-v0-3-canon-determination

      - name: Install focused test dependencies
        run: python -m pip install pytest pyyaml 'jsonschema==4.25.1'

      - name: Wire and test canon determination
        run: |
          python tools/ace/_wire_v03.py
          python -m pytest -q tests/test_aurora_ace_canon_resolution.py tests/test_aurora_ace_invocation.py tests/test_aurora_ace_invariants.py
          git diff --check
          rm tools/ace/_wire_v03.py .github/workflows/ace-v0-3-wire.yml

      - name: Commit wired v0.3 slice
        run: |
          git config user.name "Aurora ACE Integration"
          git config user.email "ace-integration@aurora.local"
          git add tools/ace/core.py tools/ace/invocation.py tools/ace/__init__.py tools/aurora_ace.py tests/test_aurora_ace_invariants.py tools/ace/_wire_v03.py .github/workflows/ace-v0-3-wire.yml
          git commit -m "feat(ace): wire canon determination into shared engine"
          git push origin HEAD:agent/ace-v0-3-canon-determination
