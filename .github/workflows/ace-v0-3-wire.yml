name: ACE v0.3 Canon Determination Wiring

on:
  push:
    branches:
      - agent/ace-v0-3-canon-determination

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: agent/ace-v0-3-canon-determination

      - name: Wire canon resolver into shared ACE surfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"needle not found in {path}: {old[:100]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"needle not unique in {path}: count={text.count(old)}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          # Register read-only retrieval and deterministic derivation as first-class capabilities.
          replace(
              "tools/ace/core.py",
              '''        {
              "capability_id": "ace.capability.canonrec.materialize.entity",''',
              '''        {
              "capability_id": "ace.capability.canonrec.retrieve.claims",
              "name": "ACE scoped CanonRec canonical-claim retriever",
              "repository": "root",
              "path": "tools/ace/canon_resolution.py",
              "operations": ["retrieve_scoped_canonical_claims", "detect_true_conflict"],
              "mutation_model": "read_only",
              "status": "active",
          },
          {
              "capability_id": "ace.capability.canonrec.derive.claims",
              "name": "ACE deterministic CanonRec claim derivation",
              "repository": "root",
              "path": "tools/ace/canon_resolution.py",
              "operations": ["derive_canonical_value"],
              "mutation_model": "read_only",
              "status": "active",
          },
          {
              "capability_id": "ace.capability.canonrec.materialize.entity",''',
          )

          # Keep canon-fact calls on the same invocation facade used by characters and facilities.
          replace(
              "tools/ace/invocation.py",
              '''from .engine import resolve_character_query
from .facility import (''',
              '''from .engine import resolve_character_query
from .canon_resolution import compile_canon_query, resolve_canon_query
from .facility import (''',
          )
          replace(
              "tools/ace/invocation.py",
              '''def compile_facility_invocation(
''',
              '''def compile_canon_invocation(
    question: str,
    context: Mapping[str, Any],
    *,
    subject_ref: str,
    field_path: str,
    claim_path: str | None = None,
    certainty_path: str = "certainty",
    derivation_rule: str | None = None,
    invocation_mode: str = "interactive",
    caller_kind: str = "user",
    caller_ref: str = "ORION.ROLE.PILOT",
    parent_invocation_ref: str | None = None,
    trigger_kind: str | None = None,
    trigger_reason: str | None = None,
    seam_ref: str | None = None,
    trigger_policy_ref: str | None = None,
    session_ref: str | None = None,
    root: Path | None = None,
) -> dict[str, Any]:
    """Compile read-only canon determination through the shared first-class facade."""

    requester_kind = caller_kind if caller_kind in {"user", "operations", "agent", "system"} else "system"
    kwargs: dict[str, Any] = {
        "subject_ref": subject_ref,
        "field_path": field_path,
        "claim_path": claim_path,
        "certainty_path": certainty_path,
        "derivation_rule": derivation_rule,
        "mode": "read_only",
        "requester_kind": requester_kind,
        "requester_id": caller_ref,
        "session_ref": session_ref,
    }
    if root is not None:
        kwargs["root"] = root
    query = compile_canon_query(question, context, **kwargs)
    return build_invocation_envelope(
        query,
        invocation_mode=invocation_mode,
        caller_kind=caller_kind,
        caller_ref=caller_ref,
        parent_invocation_ref=parent_invocation_ref,
        trigger_kind=trigger_kind,
        trigger_reason=trigger_reason,
        seam_ref=seam_ref,
        trigger_policy_ref=trigger_policy_ref,
    )


def compile_facility_invocation(
''',
          )
          replace(
              "tools/ace/invocation.py",
              '''    elif entity_type == "facility":
        if root is None:
