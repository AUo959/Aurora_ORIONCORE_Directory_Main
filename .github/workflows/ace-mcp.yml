name: ACE MCP Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/ace/**"
      - "tools/aurora_ace_mcp.py"
      - "tests/test_aurora_ace_mcp.py"
      - "requirements-ace-mcp.txt"
      - "catalog/contracts/aurora_ace_mcp_contract_v0_7.json"
      - "docs/AURORA_ACE__ADDENDUM__MCP_EXPOSURE__v0.7__2026-08-12.md"
      - ".github/workflows/ace-mcp.yml"
  push:
    branches: [main]
    paths:
      - "tools/ace/**"
      - "tools/aurora_ace_mcp.py"
      - "tests/test_aurora_ace_mcp.py"
      - "requirements-ace-mcp.txt"
      - "catalog/contracts/aurora_ace_mcp_contract_v0_7.json"
      - "docs/AURORA_ACE__ADDENDUM__MCP_EXPOSURE__v0.7__2026-08-12.md"
      - ".github/workflows/ace-mcp.yml"

permissions:
  contents: read

jobs:
  protocol:
    name: MCP v2 stdio surface (py3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ACE MCP dependencies
        run: |
          python -m pip install --only-binary=:all: \
            pytest==8.4.2 \
            -r requirements-ace-mcp.txt

      - name: Run adapter tests
        env:
          PYTHONPATH: tools
        run: pytest tests/test_aurora_ace_mcp.py -v --tb=short

      - name: Enumerate registered MCP tools through official client
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          import asyncio

          from mcp import Client
          from aurora_ace_mcp import mcp
          from ace.mcp_adapter import MCP_TOOL_NAMES

          async def check() -> None:
              async with Client(mcp) as client:
                  response = await client.list_tools()
                  names = tuple(tool.name for tool in response.tools)
                  assert len(names) == len(MCP_TOOL_NAMES), (names, MCP_TOOL_NAMES)
                  assert set(names) == set(MCP_TOOL_NAMES), (names, MCP_TOOL_NAMES)

          asyncio.run(check())
          PY
