name: ACE MCP Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/ace/**"
      - "tools/aurora_ace_mcp.py"
      - "tools/aurora_ace_mcp_operator.py"
      - "tools/aurora_ace_remote.py"
      - "tests/test_aurora_ace_mcp.py"
      - "tests/test_aurora_ace_mcp_operator_transaction.py"
      - "tests/test_aurora_ace_remote.py"
      - "requirements-ace-mcp.txt"
      - "catalog/ace/runtime_bindings.json"
      - "catalog/contracts/aurora_ace_mcp_contract_v0_7.json"
      - "catalog/contracts/aurora_ace_mcp_contract_v0_8.json"
      - "catalog/contracts/aurora_ace_mcp_operator_transaction_v0_9.json"
      - "catalog/contracts/aurora_ace_remote_service_v0_10.json"
      - "docs/AURORA_ACE__ADDENDUM__MCP_EXPOSURE__v0.7__2026-08-12.md"
      - "docs/AURORA_ACE__ADDENDUM__MCP_MATERIALIZATION__v0.8__2026-08-12.md"
      - "docs/AURORA_ACE__ADDENDUM__MCP_OPERATOR_TRANSACTIONS__v0.9__2026-08-12.md"
      - "docs/AURORA_ACE__ADDENDUM__REMOTE_SERVICE__v0.10__2026-08-13.md"
      - ".github/workflows/ace-mcp.yml"
  push:
    branches: [main]
    paths:
      - "tools/ace/**"
      - "tools/aurora_ace_mcp.py"
      - "tools/aurora_ace_mcp_operator.py"
      - "tools/aurora_ace_remote.py"
      - "tests/test_aurora_ace_mcp.py"
      - "tests/test_aurora_ace_mcp_operator_transaction.py"
      - "tests/test_aurora_ace_remote.py"
      - "requirements-ace-mcp.txt"
      - "catalog/ace/runtime_bindings.json"
      - "catalog/contracts/aurora_ace_mcp_contract_v0_7.json"
      - "catalog/contracts/aurora_ace_mcp_contract_v0_8.json"
      - "catalog/contracts/aurora_ace_mcp_operator_transaction_v0_9.json"
      - "catalog/contracts/aurora_ace_remote_service_v0_10.json"
      - "docs/AURORA_ACE__ADDENDUM__MCP_EXPOSURE__v0.7__2026-08-12.md"
      - "docs/AURORA_ACE__ADDENDUM__MCP_MATERIALIZATION__v0.8__2026-08-12.md"
      - "docs/AURORA_ACE__ADDENDUM__MCP_OPERATOR_TRANSACTIONS__v0.9__2026-08-12.md"
      - "docs/AURORA_ACE__ADDENDUM__REMOTE_SERVICE__v0.10__2026-08-13.md"
      - ".github/workflows/ace-mcp.yml"

permissions:
  contents: read

jobs:
  protocol:
    name: MCP v2 + authenticated remote surface (py3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ACE transport dependencies
        run: |
          python -m pip install --only-binary=:all: \
            pytest==8.4.2 \
            -r requirements-ace-mcp.txt

      - name: Run adapter, operator, remote, and verified-binding tests
        env:
          PYTHONPATH: tools
        run: |
          pytest \
            tests/test_aurora_ace_mcp.py \
            tests/test_aurora_ace_mcp_operator_transaction.py \
            tests/test_aurora_ace_remote.py \
            -v --tb=short

      - name: Enumerate registered MCP tools through official client
        env:
          PYTHONPATH: tools
        run: |
          python - <<'PY'
          import asyncio

          from mcp import Client
          from aurora_ace_mcp import mcp
          from ace.mcp_adapter import MCP_TOOL_NAMES

          async def check() -> None:
              async with Client(mcp) as client:
                  response = await client.list_tools()
                  names = tuple(tool.name for tool in response.tools)
                  assert len(names) == len(MCP_TOOL_NAMES), (names, MCP_TOOL_NAMES)
                  assert set(names) == set(MCP_TOOL_NAMES), (names, MCP_TOOL_NAMES)
                  assert {"ace_materialize_preview", "ace_materialize_commit"}.issubset(names)
                  assert len(names) == 6, names

          asyncio.run(check())
          PY

  operator-e2e:
    name: Operator transaction E2E (py3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ACE E2E dependencies
        run: |
          python -m pip install --only-binary=:all: \
            pytest==8.4.2 \
            pyyaml==6.0.3 \
            jsonschema==4.25.1

      - name: Read nested repo pins from registry
        id: registry_pins
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml

          registry = yaml.safe_load(open("catalog/repo_registry.yaml"))
          by_name = {repo["name"]: repo for repo in registry["repos"]}
          cloudbank = by_name["aurora-cloudbank-symbolic-main"]
          canonrec = by_name["CanonRec"]
          print(f"cloudbank_branch={cloudbank['branch']}")
          print(f"cloudbank_sha={cloudbank['head_sha']}")
          print(f"canonrec_branch={canonrec['branch']}")
          print(f"canonrec_sha={canonrec['head_sha']}")
          PY

      - name: Provision CloudBank at registered baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: AUo959/aurora-cloudbank-symbolic
          ref: ${{ steps.registry_pins.outputs.cloudbank_sha }}
          path: GUMAS_SIM_2.5/Aurora_Sim_Architecture/aurora-cloudbank-symbolic-main

      - name: Provision CanonRec at registered baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: AUo959/CanonRec
          ref: ${{ steps.registry_pins.outputs.canonrec_sha }}
          path: GUMAS_SIM_2.5/CanonRec

      - name: Place provisioned repositories on registered branches
        run: |
          git -C GUMAS_SIM_2.5/Aurora_Sim_Architecture/aurora-cloudbank-symbolic-main checkout -B "${{ steps.registry_pins.outputs.cloudbank_branch }}"
          git -C GUMAS_SIM_2.5/CanonRec checkout -B "${{ steps.registry_pins.outputs.canonrec_branch }}"

      - name: Run full operator transaction validation
        env:
          PYTHONPATH: tools
          ACE_MCP_E2E: "1"
        run: |
          pytest \
            tests/test_aurora_ace_mcp_operator_transaction.py \
            -k end_to_end_operator_transaction_materializes_inspects_and_refuses_replay \
            -v --tb=short
