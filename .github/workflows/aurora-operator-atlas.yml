name: Aurora Operator Atlas Offline Preview

on:
  pull_request:
    branches:
      - main
      - feat/intelligent-ui-private-mcp-20261015
    paths:
      - 'projects/aurora_operator_atlas/**'
      - 'tests/test_aurora_operator_atlas.py'
      - '.github/workflows/aurora-operator-atlas.yml'

permissions:
  contents: read

jobs:
  offline-preview-contract:
    name: Offline interface invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install test runner
        run: |
          python -m pip install --only-binary=:all: 'pytest==8.4.2'
      - name: Check navigation, provenance, and offline posture
        run: python -m pytest -q tests/test_aurora_operator_atlas.py
