name: Repair Branch Session State

on:
  push:
    branches:
      - governance/l1-institutional-assurance-classification
    paths:
      - .github/workflows/agent-repair-session-state.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: governance/l1-institutional-assurance-classification
          fetch-depth: 0

      - name: Rebuild branch-neutral session state
        run: |
          git show origin/main:catalog/session_state.json > /tmp/session_state_main.json
          python3 - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          state = json.loads(Path('/tmp/session_state_main.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git', 'rev-parse', '--short', 'HEAD'], text=True).strip()
          raw = subprocess.check_output(
              ['git', 'log', '--format=%h%x1f%s', 'origin/main..HEAD'],
              text=True,
          )
          branch_commits = []
          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          for line in raw.splitlines():
              if not line.strip():
                  continue
              sha, summary = line.split('\x1f', 1)
              branch_commits.append({
                  'sha': sha,
                  'date': today,
                  'platform': 'githubops',
                  'summary': summary,
              })

          existing = state.get('recent_commits', [])
          seen = {entry.get('sha') for entry in branch_commits}
          state['recent_commits'] = (
              branch_commits + [entry for entry in existing if entry.get('sha') not in seen]
          )[:10]
          state['last_platform'] = 'githubops'
          state['last_updated'] = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          state['last_session_summary'] = (
              'Gate-001 governance capability: first-class deterministic L1 institutional '
              'records, immutable execution-mode lineage, and verified external-evidence boundary.'
          )
          state.setdefault('known_state', {})['main_sha'] = head

          Path('catalog/session_state.json').write_text(
              json.dumps(state, indent=2, ensure_ascii=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit repaired state and remove temporary workflow
        run: |
          git rm .github/workflows/agent-repair-session-state.yml
          git add catalog/session_state.json
          git config user.name "aurora-githubops"
          git config user.email "aurora-githubops@users.noreply.github.com"
          git commit -m "chore: preserve session ledger while refreshing branch state"
          git push origin HEAD:governance/l1-institutional-assurance-classification
