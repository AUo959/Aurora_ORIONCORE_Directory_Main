name: ACE v0.4 Character Retrieval Wiring

on:
  push:
    branches:
      - agent/ace-v0-4-character-retrieval

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: agent/ace-v0-4-character-retrieval

      - name: Install focused dependencies
        run: python -m pip install pytest pyyaml 'jsonschema==4.25.1'

      - name: Repair, wire, and test retrieval-first character path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/ace/character_retrieval.py')
          text = path.read_text(encoding='utf-8')
          old = '''    contextual_refs = list(dict.fromkeys(\n        [\n            *[str(item) for item in context.get("contextual_refs", []) if str(item)]\n            if isinstance(context.get("contextual_refs", []), list)\n            else [],\n            *[str(item["canonical_id"]) for item in discovery["direct_candidates"]],\n            *[str(item["canonical_id"]) for item in discovery["relation_only_candidates"]],\n        ]\n    ))\n'''
          new = '''    raw_contextual_refs = context.get("contextual_refs", [])\n    base_contextual_refs = (\n        [str(item) for item in raw_contextual_refs if str(item)]\n        if isinstance(raw_contextual_refs, list)\n        else []\n    )\n    contextual_refs = list(dict.fromkeys(\n        [\n            *base_contextual_refs,\n            *[str(item["canonical_id"]) for item in discovery["direct_candidates"]],\n            *[str(item["canonical_id"]) for item in discovery["relation_only_candidates"]],\n        ]\n    ))\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one contextual_refs block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile tools/ace/character_retrieval.py tests/test_aurora_ace_character_retrieval.py
          python tools/ace/_wire_v04.py
          python -m py_compile tools/ace/core.py tools/ace/invocation.py tools/ace/__init__.py tools/aurora_ace.py
          python -m pytest -q tests/test_aurora_ace_character_retrieval.py tests/test_aurora_ace_invocation.py tests/test_aurora_ace_invariants.py
          git diff --check
          rm tools/ace/_wire_v04.py .github/workflows/ace-v0-4-wire.yml

      - name: Commit wired retrieval slice
        run: |
          git config user.name "Aurora ACE Integration"
          git config user.email "ace-integration@aurora.local"
          git add tools/ace/character_retrieval.py tools/ace/core.py tools/ace/invocation.py tools/ace/__init__.py tools/aurora_ace.py tools/ace/_wire_v04.py .github/workflows/ace-v0-4-wire.yml
          git commit -m "feat(ace): enforce retrieval before character generation"
          git push origin HEAD:agent/ace-v0-4-character-retrieval
